name: cppyy cross-platform validation

# Dedicated validation workflow for the cppyy runtime backend (PR #1769).
# It answers, per OS: (a) does cppyy install, (b) does bare cppyy JIT work,
# (c) does the Brian2 cppyy backend run a correct simulation, (d) does the
# Brian2 test-suite subset pass with codegen target = cppyy.
#
# Stages are separate hard-fail steps so the job log identifies the exact
# failure layer (install vs JIT vs backend vs test suite). A final
# always-run step writes a per-OS outcome table to the job summary.
#
# Windows background: `pip install cppyy` fails there with LNK2001
# (Cppyy::GetNumBasesLongestBranch) — an ABI mismatch between the pre-built
# cppyy-backend .lib and CPyCppyy compiled from source under PEP 517 build
# isolation. Tracked upstream as wlav/cppyy#282. The maintainer-confirmed
# workaround (install each stack layer bottom-up with --no-deps
# --no-build-isolation) is what the Windows install step uses.
#
# Runner choice: windows-2022 is the primary Windows evidence (VS 2022, the
# toolchain the #282 workaround was verified on). windows-latest (Server
# 2025 + VS 2026 since June 2026) is included as a forward-compatibility
# probe; a failure there but not on windows-2022 means "new VS image
# problem", not "cppyy cannot work on Windows".
#
# Python 3.12: supported by Brian2, and the exact version on which the
# wlav/cppyy#282 workaround was verified by upstream users.

on:
  workflow_dispatch:
  # Also run when this workflow or its smoke script change, so pushing the
  # validation itself produces results without a manual dispatch (manual
  # dispatch from the Actions UI requires the file on the default branch).
  push:
    paths:
      - ".github/workflows/cppyy-cross-platform.yml"
      - "dev/continuous-integration/cppyy_smoke_test.py"

permissions:
  contents: read

jobs:
  validate:
    name: "cppyy on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022, windows-latest]
    defaults:
      run:
        # bash on all OSes (Git Bash on Windows) — one quoting dialect, and
        # it inherits the MSVC env vars exported by ilammy/msvc-dev-cmd.
        shell: bash
    env:
      # macOS: cppyy's libCling links zstd from a MacPorts path; make
      # Homebrew's zstd (arm64 + Intel locations) resolvable at runtime.
      # Harmless on Linux/Windows. Same setting as testsuite.yml.
      DYLD_LIBRARY_PATH: "/opt/homebrew/opt/zstd/lib:/usr/local/opt/zstd/lib"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Windows only: put MSVC (cl.exe / link.exe) on PATH *before* pip
      # compiles CPyCppyy / cppyy-backend from source — no Windows wheels
      # exist for them, so a C++ compiler is mandatory on Windows.
      - name: Set up MSVC developer environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: "Stage 0 — environment and toolchain report"
        id: stage0
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          echo "== OS =="
          uname -a || true
          echo "== Python =="
          "$PYTHON_BINARY" -VV
          "$PYTHON_BINARY" -c "import platform, struct; print(platform.platform()); print('pointer size:', struct.calcsize('P') * 8, 'bit')"
          "$PYTHON_BINARY" -m pip --version
          echo "== Compilers on PATH =="
          command -v gcc && gcc --version | head -1 || true
          command -v clang && clang --version | head -1 || true
          command -v cl && (cl 2>&1 | head -2) || true
          echo "== cppyy/MSVC-relevant environment =="
          env | grep -iE '^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsVersion|VSCMD|CPPYY|EXTRA_CLING|DYLD)' || echo "(none set)"

      - name: Install Brian2 with test dependencies
        id: install-brian2
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_BINARY" -m pip install --upgrade pip
          # setuptools/wheel must be present explicitly: the Windows cppyy
          # install below disables PEP 517 build isolation, so the build
          # backend has to live in the main environment.
          "$PYTHON_BINARY" -m pip install --upgrade setuptools wheel
          "$PYTHON_BINARY" -m pip install ".[test]"

      - name: Install cppyy (Linux/macOS — plain pip)
        id: install-cppyy-nix
        if: runner.os != 'Windows'
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          # cppyy/CPyCppyy publish no wheels anywhere, so this compiles them
          # from source; that build is healthy on gcc/clang. Hard-fail: this
          # workflow exists to surface install failures, not to hide them.
          "$PYTHON_BINARY" -m pip install "cppyy>=3.1"
          echo "== installed cppyy stack =="
          "$PYTHON_BINARY" -m pip list | grep -iE "cppyy|CPyCppyy"

      - name: Install cppyy (Windows — wlav/cppyy#282 layered workaround)
        id: install-cppyy-win
        if: runner.os == 'Windows'
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          # Plain `pip install cppyy` fails on Windows (LNK2001, see header
          # comment). Workaround: install each layer of the stack bottom-up
          # with --no-deps --no-build-isolation so the from-source builds
          # link against the freshly installed cppyy-backend instead of an
          # isolated (stale) copy. Versions pinned to the combination
          # confirmed working in the wlav/cppyy#282 thread (2025-04-23).
          "$PYTHON_BINARY" -m pip install cppyy-cling==6.32.8 --no-deps --no-build-isolation --force-reinstall
          "$PYTHON_BINARY" -m pip install cppyy-backend==1.15.3 --no-deps --no-build-isolation --force-reinstall
          "$PYTHON_BINARY" -m pip install CPyCppyy==1.13.0 --no-deps --no-build-isolation --force-reinstall
          "$PYTHON_BINARY" -m pip install cppyy==3.5.0 --no-deps --no-build-isolation --force-reinstall
          echo "== installed cppyy stack =="
          "$PYTHON_BINARY" -m pip list | grep -iE "cppyy|CPyCppyy"

      - name: "Stage 1 — bare cppyy JIT smoke test (no Brian2)"
        id: stage1
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_BINARY" - <<'EOF'
          import cppyy
          print("cppyy version:", cppyy.__version__)
          cppyy.cppdef("int add(int a, int b) { return a + b; }")
          result = cppyy.gbl.add(2, 3)
          print("add(2, 3) =", result)
          assert result == 5
          print("STAGE1_OK: cppyy can JIT-compile and run C++")
          EOF

      - name: "Stage 2 — Brian2 cppyy backend smoke simulation"
        id: stage2
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          # Run from outside the checkout so `import brian2` resolves to the
          # installed package (same convention as testsuite.yml).
          cd "$RUNNER_TEMP"
          "$PYTHON_BINARY" "$GITHUB_WORKSPACE/dev/continuous-integration/cppyy_smoke_test.py"

      - name: "Stage 3 — Brian2 test-suite subset (codegen target = cppyy)"
        id: stage3
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          cd "$RUNNER_TEMP"
          "$PYTHON_BINARY" "$GITHUB_WORKSPACE/dev/continuous-integration/cppyy_smoke_test.py" --suite

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### cppyy validation — \`${{ matrix.os }}\`"
            echo ""
            echo "| Layer | Outcome |"
            echo "| --- | --- |"
            echo "| Brian2 install | ${{ steps.install-brian2.outcome }} |"
            echo "| cppyy install (Linux/macOS) | ${{ steps.install-cppyy-nix.outcome }} |"
            echo "| cppyy install (Windows workaround) | ${{ steps.install-cppyy-win.outcome }} |"
            echo "| Stage 1: bare cppyy JIT | ${{ steps.stage1.outcome }} |"
            echo "| Stage 2: Brian2 cppyy smoke simulation | ${{ steps.stage2.outcome }} |"
            echo "| Stage 3: test-suite subset (target=cppyy) | ${{ steps.stage3.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
